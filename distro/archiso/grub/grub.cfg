# Black Moon OS GRUB config (UEFI). mkarchiso substitutes
# %ARCHISO_LABEL% with the ISO label at build time.
set timeout_style=menu
set timeout=15
set default=0

insmod all_video
insmod gfxterm
set gfxmode=auto
terminal_output gfxterm

menuentry "Black Moon OS (x86_64)" --class arch --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    search --no-floppy --set=root --label '%ARCHISO_LABEL%'
    linux /blackmoon/boot/x86_64/vmlinuz-linux archisobasedir=blackmoon archisolabel='%ARCHISO_LABEL%' earlymodules=loop
    initrd /blackmoon/boot/x86_64/initramfs-linux.img
}

menuentry "Black Moon OS (x86_64, fallback initramfs)" --class arch --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    search --no-floppy --set=root --label '%ARCHISO_LABEL%'
    linux /blackmoon/boot/x86_64/vmlinuz-linux archisobasedir=blackmoon archisolabel='%ARCHISO_LABEL%' earlymodules=loop
    initrd /blackmoon/boot/x86_64/initramfs-linux-fallback.img
}
