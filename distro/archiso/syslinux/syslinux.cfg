# Black Moon OS syslinux config (BIOS). mkarchiso substitutes
# %ARCHISO_LABEL% with the ISO label at build time.
UI vesamenu.c32
MENU TITLE Black Moon OS
TIMEOUT 150
DEFAULT blackmoon

LABEL blackmoon
  MENU LABEL Black Moon OS (x86_64)
  LINUX /blackmoon/boot/x86_64/vmlinuz-linux
  INITRD /blackmoon/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=blackmoon archisolabel=%ARCHISO_LABEL% earlymodules=loop

LABEL blackmoon_fallback
  MENU LABEL Black Moon OS (x86_64, fallback initramfs)
  LINUX /blackmoon/boot/x86_64/vmlinuz-linux
  INITRD /blackmoon/boot/x86_64/initramfs-linux-fallback.img
  APPEND archisobasedir=blackmoon archisolabel=%ARCHISO_LABEL% earlymodules=loop
