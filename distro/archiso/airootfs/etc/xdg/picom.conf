# Black Moon OS glass theme — picom compositor config.
# The "macOS glass" look: blurred translucent windows, rounded corners,
# soft shadows, a translucent panel and dock. XFCE itself has no blur,
# so picom does all of it; if picom is not running, the desktop simply
# falls back to plain opaque windows (nothing breaks).
backend = "glx";
vsync = true;

# Frosted glass: blur what is behind translucent windows.
blur = {
  method = "dual_kawase";
  strength = 5;
};
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Rounded corners, macOS-style.
corner-radius = 16;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Soft shadows + gentle fades.
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.5;
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

# Slight translucency everywhere; the panel and dock are glassier.
inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 0.85;
opacity-rule = [
  "88:class_g = 'Xfce4-panel'",
  "88:class_g = 'xfce4-panel'",
  "92:class_g = 'Plank'",
  "92:class_g = 'plank'"
];
