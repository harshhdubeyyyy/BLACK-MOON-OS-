# Black Moon OS LightDM config (live session only).
# The live session autologs in as root — that is normal for a live
# image and is NOT how an installed system behaves: blackmoon-install
# creates a real user with sudo, and installed systems log in as that
# user. If the graphical login ever fails to appear, the console is
# still root-autologin: run `startxfce4` from there.
[Seat:*]
greeter-session=lightdm-gtk-greeter
user-session=xfce
autologin-user=root
autologin-session=xfce
